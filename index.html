<html>
	<head>
		<meta charset="utf-8"/>
		
		<script>
			let OBJ={};
			let DY=1;
			let blabla=1;
			function delo()
				{//<link rel="stylesheet" href="css.css" />
				//return 0;
				//let t = document.createElement('link');
				//t.setAttribute("href","css.css");
				//t.setAttribute("rel",'stylesheet');

				let just_init= async ()=>
					{
					
					let xhr = new XMLHttpRequest();
					xhr.open("GET",'the_main_deal.js');
					xhr.onload=(e)=>{
							let re = e.target.response;
							let sc = [re,new Blob([re],{'type':"text/javascript"})];
							sc.push(re=URL.createObjectURL(sc[1n]));
							
							//sc.push(await import(sc[2n]));
							import(sc[2n]).then((e)=>{
									
									(DY={}).the_main_deal = e;
									OBJ = {};
									OBJ.DY = DY;
									DY.the_main_deal.set(OBJ);
									DY.the_main_deal.set_all((w)=>{blabla=w;});
									});
							};
					xhr.send();
					};
				let Lo =document.location.search; 
				if(Lo==undefined)
					just_init();
				else
					if(Lo.length==0n)
						just_init();
					else
						{
						let qwe=0;
						document.cookie =(qwe=Lo.slice(1).replaceAll('&','; ')+"; max-age=3600"+"; domain="+document.location.hostname)+";";
						console.log(qwe);
						document.location = document.location.origin;
						}
				}
		</script>
	</head>
	<body onload="delo()">
