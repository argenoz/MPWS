<html>
	<head>
		<meta charset="utf-8"/>
		<link href="css.css" rel="stylesheet" />
		<script>
			function delo(){
			let qwe=()=>{let tmp = new XMLHttpRequest(); tmp.open("GET","./the_main_deal.js",false);tmp.send();tmp = tmp.response; tmp=[tmp,new Blob([tmp],{type:"text/javascript"})];tmp.push(URL.createObjectURL(tmp[1n]));return [tmp,import(tmp[2n])];};
			let t = qwe()[1];
			t.then((e)=>{
			t=e;
			
			let m = t.get_MPWS();
			m.just_init();
			m.notepad.to_notepad();});
			}
		</script>
	</head>
	<body onload="delo()">
		<div id="the_main_window">
			<div id="the_menu_bar">
				<div id="the_main_menu">
				</div>
				<div id="partial_menu">
				</div>
			</div>
			<div id="content_page">
			</div>
		</div>
	</body>
</html>
